name: CI CD pipeline portfolio

on:
    push:
        branches: [staging, main]
    pull_request:
        branches: [staging, main]

permissions:
    contents: read

concurrency:
    group: ${{github.workflow}}-${{github.ref}}
    cancel-in-progress: ${{github.ref != 'refs/heads/main'}}

jobs:
    verify:
        name: Verify and typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npx tsc --noEmit

    test:
        name: Unit test
        needs: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test

    depedency-review:
        name: Depedency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/dependency-review-action@v4

    build-push:
        name: Build and push image
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        runs-on: ubuntu-latest
        outputs:
            image: ${{steps.meta.outputs.image}}
            tag: ${{steps.meta.outputs.tag}}
            pinned: ${{steps.pin.outputs.pinned}}
        steps:
            - uses: actions/checkout@v4
            - id: meta
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
              run: |
                  IMAGE=$(bash scripts/image-tag.sh)"
                  echo "image=$IMAGE" >> $GITHUB_OUTPUT
                  echo "tag=${IMAGE##*:}" >> $GITHUB_OUTPUT

            - uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}

            - id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - id: pin
              env:
                  IMAGE: ${{steps.meta.outputs.image}}
                  DIGEST: ${{steps.build.outputs.digest}}
              run: |
                  echo "pinned=${IMAGE:*}@${DIGEST}" >> $GITHUB_OUTPUT
                  echo "Pinned : ${IMAGE:*}@${DIGEST}"
